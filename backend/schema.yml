components:
  schemas:
    AddCartItem:
      type: object
      properties:
        food_item:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
        replace:
          type: boolean
          default: false
      required:
      - food_item
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 20
        house_number:
          type: string
          maxLength: 120
        street:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        is_default:
          type: boolean
      required:
      - city
      - full_name
      - house_number
      - id
      - phone
      - postal_code
      - state
      - street
    AddressTypeEnum:
      enum:
      - home
      - office
      - other
      type: string
      description: |-
        * `home` - Home
        * `office` - Office
        * `other` - Other
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - date_joined
      - email
      - id
      - phone
    ApplyCoupon:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        restaurant:
          type: integer
          nullable: true
        coupon:
          type: integer
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivery_fee
      - id
      - items
      - subtotal
      - tax
      - updated_at
    CartItem:
      type: object
